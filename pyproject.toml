[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-cli"
version = "0.1.0"
description = "CLI para operar o LinkedIn via sessão de navegador persistente"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.0"]

[project.scripts]
linkedin = "linkedin_cli.cli:main"

[tool.setuptools.packages.find]
include = ["linkedin_cli*"]
